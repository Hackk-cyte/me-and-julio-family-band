name: Test and deploy Family Band
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize initial browser upload
        if: hashFiles('package.json') == ''
        run: |
          unzip -q source.zip
          unzip -q audio-a.zip
          unzip -q audio-b.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit materialized source once
        run: |
          if ! git ls-files --error-unmatch package.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json tsconfig.json vite.config.ts playwright.config.ts index.html README.md .gitignore src public tests docs
            git commit -m 'Materialize verified application source and licensed assets'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize initial browser upload
        if: hashFiles('package.json') == ''
        run: |
          unzip -q source.zip
          unzip -q audio-a.zip
          unzip -q audio-b.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: https://hackk-cyte.github.io/me-and-julio-family-band/
